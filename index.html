<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museu Interativo: Diáspora e Luz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Museu Interativo</h1>
        <p>Diáspora e Luz — A história da imigração no Paraná</p>
    </header>

    <!-- Navegação do Museu -->
    <nav id="navegacao-museu">
        <button class="ativo" data-sala="0">Diáspora Europeia e Asiática</button>
        <button data-sala="1">Italianos</button>
        <button data-sala="2">Alemães</button>
        <button data-sala="3">Poloneses e Ucranianos</button>
        <button data-sala="4">Japoneses</button>
    </nav>

    <!-- Conteúdo Principal -->
    <main id="sala-exposicao">
        <!-- O conteúdo será inserido via JavaScript -->
        <div class="sala-exposicao ativa" id="sala-0">
            <h2>Carregando...</h2>
            <p>Aguarde enquanto preparamos a exposição.</p>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Museu Interativo: Diáspora e Luz — Projeto Paraná</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
